name: Secret Scan

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # gitleaks/gitleaks-action requires a paid license for org-owned repos
        # (bawbel is an org; the free tier is personal-account-only). The
        # gitleaks CLI itself is fully open source, so run it directly.
        # Version is pinned for reproducible CI runs; bump deliberately.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --log-opts="--all" --redact --config .gitleaks.toml --exit-code 1
