name: CI Security Scans

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  code-scan:
    name: Code Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit installed dependencies for known vulnerabilities
        run: |
          # Upgrade pip/setuptools first: the venv's bootstrap setuptools is
          # old enough to carry its own CVEs, which would fail every run on
          # build tooling rather than this project's actual dependencies.
          pip install --quiet --upgrade pip setuptools
          pip install --quiet pip-audit
          pip install --quiet -e ".[dev,ops]"
          pip-audit

  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # gitleaks/gitleaks-action requires a paid license for org-owned repos
        # (bawbel is an org; the free tier is personal-account-only). The
        # gitleaks CLI itself is fully open source, so run it directly.
        # Version is pinned for reproducible CI runs; bump deliberately.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --log-opts="--all" --redact --config .gitleaks.toml --exit-code 1
