name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - os: macos-latest
            python: "3.12"
            experimental: false
          # Windows is unproven for a stdio proxy. It reports, and does not block, until it is.
          # It has failed tests/test_m6_console.py::TestApprovalRegistry::test_expired_approval_not_retrievable
          # in some runs and not others (issue #105).
          - os: windows-latest
            python: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pre-commit
        run: pre-commit run --all-files

  wheel:
    name: wheel installs and runs from a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel outside the source tree and run it
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/verify-venv/bin/bawbel-gate --version
          cd /tmp && /tmp/verify-venv/bin/bawbel-gate lint --help
      - name: The wheel ships the py.typed marker
        run: unzip -l dist/*.whl | grep -q 'bawbel_gate/py.typed'

  # The mypy run on src/ reports and does not block: its step has continue-on-error, so the
  # job stays green and the count is in the job summary. Make it blocking once the errors are
  # down to zero. The consumer step does fail the job: it checks that py.typed still works.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: mypy on src/
        continue-on-error: true
        run: |
          status=0
          mypy > mypy.txt 2>&1 || status=$?
          cat mypy.txt
          { echo "### mypy on src/"; echo; tail -n 1 mypy.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: A consumer of the built package gets types
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/consumer-venv
          /tmp/consumer-venv/bin/pip install mypy dist/*.whl
          printf 'from bawbel_gate.policy.manifest import load_manifest\n' > /tmp/consumer.py
          cd /tmp && /tmp/consumer-venv/bin/mypy /tmp/consumer.py
