name: Dependency Scan

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audit installed dependencies for known vulnerabilities
        run: |
          # Upgrade pip/setuptools first: the venv's bootstrap setuptools is
          # old enough to carry its own CVEs, which would fail every run on
          # build tooling rather than this project's actual dependencies.
          pip install --quiet --upgrade pip setuptools
          pip install --quiet pip-audit
          pip install --quiet -e ".[dev,ops]"
          pip-audit
