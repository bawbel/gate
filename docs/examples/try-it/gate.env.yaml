# Used by docs/TRY-IT.md. Paths are relative to the directory the gate is started in.
schema: bawbel/gate-config/v1
audit_log: gate.env.audit.jsonl
approval:
  channel: terminal
  timeout_seconds: 5
  on_timeout: deny
servers:
  - name: env
    command: python3
    args: ["env_probe_server.py"]
    manifest: env.cap.yaml
