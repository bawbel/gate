schema: bawbel/capability-manifest/v1
subject:
  kind: mcp-server
  name: bench
  transport: stdio

provenance_class: tool.response.bench
instruction_authority: none

trifecta:
  private_data: false
  untrusted_content: false
  external_comms: false

grants:
  tools:
    - name: get_file
      effect: allow
    - name: needs_ok
      effect: approve
    - name: "*"
      effect: deny
  argument_guards:
    - applies_to: "*"
      outbound_secret_scan: true
